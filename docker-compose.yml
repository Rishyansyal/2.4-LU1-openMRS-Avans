services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
    ports:
      - "3032:80"

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:?OMRS_DB_USER is required}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:?OMRS_DB_PASSWORD is required}
      OPENMRS_WEBHOOK_BACKEND_URL: ${OPENMRS_WEBHOOK_BACKEND_URL:-http://host.docker.internal:5111/api/webhooks/openmrs/appointments}
      OPENMRS_WEBHOOK_SECRET: ${OPENMRS_WEBHOOK_SECRET:?OPENMRS_WEBHOOK_SECRET is required}
      OPENMRS_WEBHOOK_ORGANIZATION_ID: ${OPENMRS_WEBHOOK_ORGANIZATION_ID:?OPENMRS_WEBHOOK_ORGANIZATION_ID is required}
      OPENMRS_WEBHOOK_OUTBOX_PATH: ${OPENMRS_WEBHOOK_OUTBOX_PATH:-/openmrs/data/openmrs-webhook-outbox.jsonl}
      OPENMRS_WEBHOOK_RETRY_INTERVAL_MS: ${OPENMRS_WEBHOOK_RETRY_INTERVAL_MS:-300000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data

  # MariaDB
  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --host=127.0.0.1 --protocol=TCP --user=${OMRS_DB_USER:?OMRS_DB_USER is required} --password=${OMRS_DB_PASSWORD:?OMRS_DB_PASSWORD is required} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:?OMRS_DB_USER is required}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:?OMRS_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
